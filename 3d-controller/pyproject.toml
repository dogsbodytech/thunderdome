[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thunderdome"
version = "0.1.0"
description = "Python 3D LED rendering foundation for Thunderdome"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.10,<4"]

[project.scripts]
thunderdome = "thunderdome.cli:main"

[tool.setuptools]
package-dir = {"" = "controller"}

[tool.setuptools.packages.find]
where = ["controller"]

[tool.setuptools.data-files]
"share/thunderdome/geometry" = ["geometry/thunderdome_geometry.json"]
"share/thunderdome/geometry/routes" = ["geometry/routes/string_routes.json"]
"share/thunderdome/simulator/static" = ["simulator/static/index.html", "simulator/static/simulator.css", "simulator/static/simulator.js", "simulator/static/control-ui.js"]
"share/thunderdome/simulator/static/vendor" = ["simulator/static/vendor/three.module.js", "simulator/static/vendor/OrbitControls.js", "simulator/static/vendor/LICENSE.threejs"]
